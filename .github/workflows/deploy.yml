name: Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: alia-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: alia-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke test (stack up)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for CI
        run: |
          cat > .env <<EOF
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=alia-knowledge
          JWT_SECRET=ci-test-secret
          CORS_ORIGINS=http://localhost
          EOF

      - name: Start stack
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker compose ps --format json | python3 -c "
          import sys, json
          for line in sys.stdin:
            s = json.loads(line)
            if 'backend' in s.get('Service',''):
              print(s.get('Health','unknown'))
          " 2>/dev/null || echo "unknown")
            echo "Attempt $i — backend health: $STATUS"
            if [ "$STATUS" = "healthy" ]; then break; fi
            sleep 5
          done

      - name: Health check
        run: |
          curl -sf http://localhost:8000/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(json.dumps(d, indent=2))
          assert d['status'] in ('ok', 'degraded'), f'Unexpected status: {d}'
          print('Health check passed')
          "

      - name: Root endpoint check
        run: curl -sf http://localhost:8000/ | grep -q "ALIA Backend API"

      - name: Tear down
        if: always()
        run: docker compose down -v
