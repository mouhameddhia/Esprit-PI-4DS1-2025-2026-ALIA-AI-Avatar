name: NLP Evaluation

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  evaluate-nlp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Run NLP evaluator quality gate
        run: |
          python NLP/evaluation/run_eval.py NLP/datasets/eval_intent_safety_v3.jsonl \
            --min-intent-accuracy 0.90 \
            --min-safety-recall 0.95 \
            --min-secondary-tags-recall 0.70 \
            --min-entity-map-recall 0.70 \
            --output-json NLP/evaluation/results/ci_eval.json

      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: nlp-eval-result
          path: NLP/evaluation/results/ci_eval.json
